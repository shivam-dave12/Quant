[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-hft-live-learning"
version = "5.7.0"
description = "Delta BTCUSD real-data live-learning microstructure trading bot"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "requests>=2.31",
  "websocket-client>=1.6",
  "python-dotenv>=1.0"
]

[project.scripts]
btc-live-hft = "btchft.cli:main"

[tool.setuptools.packages.find]
include = ["btchft*"]
